<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENGLISH JOURNEY - MS. NGUYENMEE</title>
  <!-- Google Font Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FAF6EE;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP HEADER */
    header {
      background-color: #FFFFFF;
      border-bottom: 3px solid #000;
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 0 #000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background-color: #FF6B00;
      border: 2px solid #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #FFF;
      font-size: 20px;
      box-shadow: 2px 2px 0 #000;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-title span {
      color: #FF6B00;
    }

    .user-info-bar {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-pill {
      background: #FFF;
      border: 2.5px solid #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 3px 3px 0 #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout {
      background: #FFF;
      border: 2.5px solid #000;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      transition: all 0.1s;
    }

    .btn-logout:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
    }

    /* CARD STYLING */
    .card {
      background: #FFFFFF;
      border: 3px solid #000;
      border-radius: 16px;
      box-shadow: 6px 6px 0 #000;
      padding: 24px;
      margin-bottom: 25px;
    }

    /* LOGIN SCREEN */
    .login-card {
      text-align: center;
      max-width: 450px;
      margin: 50px auto;
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2.5px solid #000;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      box-shadow: 3px 3px 0 #000;
    }

    .btn-primary {
      width: 100%;
      background: #FF6B00;
      color: #FFF;
      border: 3px solid #000;
      padding: 12px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
      margin-top: 10px;
    }

    .btn-primary:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    /* LESSON HEADER CARD */
    .lesson-header {
      text-align: center;
      position: relative;
      padding: 18px;
    }

    .lesson-category {
      font-size: 12px;
      font-weight: 800;
      color: #8899A6;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .lesson-title {
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .btn-back {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* QUIZ QUESTION CARD */
    .question-badge {
      display: inline-block;
      background: #FF6B00;
      color: #FFF;
      border: 2.5px solid #000;
      padding: 6px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 3px 3px 0 #000;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    /* 4 OPTIONS GRID */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background: #FAF6EE;
      border: 3px solid #000;
      border-radius: 14px;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #FFF;
      transform: translateY(-2px);
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    /* Feedback Colors */
    .option-btn.correct {
      background-color: #D1E7DD !important;
      border-color: #0F5132 !important;
      color: #0F5132;
    }

    .option-btn.wrong {
      background-color: #F8D7DA !important;
      border-color: #842029 !important;
      color: #842029;
    }

    /* FEEDBACK & EXPLANATION BOX */
    .feedback-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      border: 2.5px solid #000;
      font-weight: 600;
      display: none;
      line-height: 1.5;
    }

    .feedback-box.correct {
      background: #D1E7DD;
      color: #0F5132;
      display: block;
    }

    .feedback-box.wrong {
      background: #F8D7DA;
      color: #842029;
      display: block;
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-next {
      background: #FF6B00;
      color: #FFF;
      border: 3px solid #000;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      display: none;
    }

    .btn-next:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    /* FLOATING WIDGET */
    .floating-widget {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #A855F7;
      color: #FFF;
      border: 3px solid #000;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 4px 4px 0 #000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-logo">E</div>
      <div class="brand-title">ENGLISH JOURNEY - <span>MS. NGUYENMEE</span></div>
    </div>
    <div class="user-info-bar hidden" id="userInfoBar">
      <div class="user-pill">
        👤 <span id="lblStudentInfo">Học sinh</span>
      </div>
      <button class="btn-logout" onclick="logout()">↳ Thoát</button>
    </div>
  </header>

  <div class="container">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div class="card login-card" id="loginScreen">
      <h2>ĐĂNG NHẬP HỌC SINH</h2>
      <div class="form-group">
        <label for="txtHoTen">Họ và tên học sinh:</label>
        <input type="text" id="txtHoTen" placeholder="Ví dụ: Hồ Văn Hân">
      </div>
      <div class="form-group">
        <label for="txtLop">Lớp:</label>
        <input type="text" id="txtLop" placeholder="Ví dụ: 6A3">
      </div>
      <button class="btn-primary" onclick="startQuiz()">Bắt đầu làm bài</button>
    </div>

    <!-- MÀN HÌNH BÀI THI -->
    <div id="quizScreen" class="hidden">
      <!-- HEADER BÀI HỌC -->
      <div class="card lesson-header">
        <button class="btn-back" onclick="logout()">← Thoát</button>
        <div class="lesson-category">NATURE & ENVIRONMENT</div>
        <div class="lesson-title">IN ONE CUBIC FOOT - LUYỆN TRẮC NGHIỆM</div>
      </div>

      <!-- KHUNG CÂU HỎI -->
      <div class="card">
        <div id="loadingText" style="text-align: center; font-weight: 700; padding: 20px;">
          ⏳ Đang tải câu hỏi từ Google Sheet...
        </div>

        <div id="quizContent" class="hidden">
          <div class="question-badge" id="questionBadge">Câu hỏi 1 / 10</div>
          <div class="question-text" id="questionText">Nội dung câu hỏi...</div>

          <div class="options-grid" id="optionsGrid"></div>

          <div class="feedback-box" id="feedbackBox"></div>

          <div class="action-bar">
            <button class="btn-next" id="btnNext" onclick="nextQuestion()">Câu tiếp theo ➔</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- FLOATING WIDGET -->
  <div class="floating-widget">
    🦉 Hỏi Hedwig
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwJOl0Y3HuJJx7Y6DfbCsHao9ul0PD9n9j9aW8w0ghBpi03oyWJkIHIV-A8PMHE6cVUUQ/exec";

    let questionsData = [];
    let currentQuestionIndex = 0;
    let studentAnswers = [];
    let currentStudentName = "";
    let currentStudentClass = "";

    // Bắt đầu làm bài
    function startQuiz() {
      const name = document.getElementById("txtHoTen").value.trim();
      const className = document.getElementById("txtLop").value.trim();

      if (!name || !className) {
        alert("Vui lòng nhập đầy đủ Họ tên và Lớp!");
        return;
      }

      currentStudentName = name;
      currentStudentClass = className;

      document.getElementById("lblStudentInfo").innerText = `${name} (${className})`;
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("userInfoBar").classList.remove("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");

      loadQuestionsFromSheet();
    }

    // Thoát
    function logout() {
      if (confirm("Bạn có chắc chắn muốn thoát không?")) {
        location.reload();
      }
    }

    // Tải câu hỏi từ Google Sheet
    function loadQuestionsFromSheet() {
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          questionsData = data;
          document.getElementById("loadingText").classList.add("hidden");
          document.getElementById("quizContent").classList.remove("hidden");
          showQuestion(0);
        })
        .catch(err => {
          console.error("Lỗi tải câu hỏi:", err);
          document.getElementById("loadingText").innerHTML = "❌ Lỗi tải câu hỏi từ Google Sheet!";
        });
    }

    // Hiển thị câu hỏi
    function showQuestion(index) {
      currentQuestionIndex = index;
      const q = questionsData[index];

      document.getElementById("questionBadge").innerText = `Câu hỏi ${index + 1} / ${questionsData.length}`;
      document.getElementById("questionText").innerText = q.question;

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";

      const feedback = document.getElementById("feedbackBox");
      feedback.className = "feedback-box";
      feedback.style.display = "none";

      document.getElementById("btnNext").style.display = "none";

      const keys = ['A', 'B', 'C', 'D'];
      keys.forEach(key => {
        if (q.options[key]) {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = q.options[key];
          btn.onclick = () => selectOption(key, btn);
          grid.appendChild(btn);
        }
      });
    }

    // Chọn đáp án, hiển thị Đúng/Sai & Diễn giải
    function selectOption(selectedKey, selectedBtn) {
      const q = questionsData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".option-btn");

      buttons.forEach(btn => btn.disabled = true);
      studentAnswers[currentQuestionIndex] = selectedKey;

      const isCorrect = selectedKey.toUpperCase() === q.correctAnswer.toUpperCase();
      const feedback = document.getElementById("feedbackBox");
      const explanationText = q.explanation ? `<br><b>Diễn giải:</b> ${q.explanation}` : '';

      if (isCorrect) {
        selectedBtn.classList.add("correct");
        feedback.innerHTML = `<b>Kết quả:</b> Đúng 🎉 ${explanationText}`;
        feedback.className = "feedback-box correct";
      } else {
        selectedBtn.classList.add("wrong");
        const correctOptionText = q.options[q.correctAnswer.toUpperCase()] || '';
        feedback.innerHTML = `<b>Kết quả:</b> Sai ❌ (Đáp án đúng là: <b>${q.correctAnswer}. ${correctOptionText}</b>) ${explanationText}`;
        feedback.className = "feedback-box wrong";
      }

      const btnNext = document.getElementById("btnNext");
      if (currentQuestionIndex === questionsData.length - 1) {
        btnNext.innerText = "Nộp bài & Lưu kết quả 🚀";
      } else {
        btnNext.innerText = "Câu tiếp theo ➔";
      }
      btnNext.style.display = "block";
    }

    // Chuyển câu tiếp theo hoặc nộp bài
    function nextQuestion() {
      if (currentQuestionIndex < questionsData.length - 1) {
        showQuestion(currentQuestionIndex + 1);
      } else {
        submitFinalQuiz();
      }
    }

    // Gửi kết quả về Google Sheet
    function submitFinalQuiz() {
      let correctCount = 0;
      const detailsArray = [];

      questionsData.forEach((q, i) => {
        const studentAns = studentAnswers[i] || '';
        if (studentAns.toUpperCase() === q.correctAnswer.toUpperCase()) {
          correctCount++;
          detailsArray.push(`C${i + 1}: Đ`);
        } else {
          detailsArray.push(`C${i + 1}: S`);
        }
      });

      const formattedResult = `${correctCount}/${questionsData.length} câu | ${detailsArray.join(', ')}`;

      const payload = {
        timestamp: new Date().toLocaleString('vi-VN'),
        ten: currentStudentName,
        lop: currentStudentClass,
        ketQua: formattedResult,
        nhanXet: `Đúng ${correctCount}/${questionsData.length}`
      };

      document.getElementById("btnNext").innerText = "⏳ Đang gửi kết quả...";
      document.getElementById("btnNext").disabled = true;

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert(`Chúc mừng ${currentStudentName}! Bạn đã hoàn thành bài thi.\nKết quả: ${correctCount}/${questionsData.length} câu đúng.`);
        location.reload();
      })
      .catch(err => {
        console.error("Lỗi:", err);
        alert("Có lỗi xảy ra khi gửi kết quả!");
      });
    }
  </script>
</body>
</html>
